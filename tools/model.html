<!doctype html>
<meta charset="utf-8">
<title>TerraGlide — the character on its own</title>
<style>html,body{margin:0;background:#6b7a86;overflow:hidden}canvas{display:block}</style>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { Avatar } from '../src/player/avatar.js';
import { settings } from '../src/core/settings.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
/*
  ?size=N renders at N instead of 700.

  Everything about this figure has been judged from a 700-pixel square, which
  is about the size it is in a contact sheet and nowhere near the size it needs
  to be to tell a hole from a stair-stepped edge. A black speck at 700 is four
  pixels; at 2400 it is either a hole or it is gone.
*/
const SIZE = Math.min(4096, Math.max(200,
  Number(new URLSearchParams(location.search).get('size')) || 700));
renderer.setSize(SIZE, SIZE);
/*
  And drawn at twice that, then resolved down.

  Four-sample multisampling smooths the edge of a silhouette and does nothing
  at all for what is inside it, so a black boot against dark ground came out
  with a notched, stepped outline and a smooth shading gradient down a trouser
  leg came out in bands — both of which read as a compressed picture and are
  neither: the atlas is a 1024 PNG uploaded at 1024, and the positions,
  normals and coordinates are all float32. It was the shot that was low
  resolution, not the model in it. Rendering into a buffer twice as wide and
  letting the browser resolve it into the screenshot samples every pixel four
  times over, inside the silhouette as well as on it.
*/
renderer.setPixelRatio(2);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6b7a86);

// The game's own lights, at the game's own intensities. See world/sky.js.
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-0.45, 0.78, -0.44).multiplyScalar(100);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd0e4, 0x4a4a44, 1.1));

// A patch of ground, so the figure is standing on something and the hemisphere
// light has a floor to bounce off the way it does in the world.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshLambertMaterial({ color: 0x5b6b4a }),
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const avatar = new Avatar(scene);
avatar.setVisible(true);
// The scanned pieces, when they are asked for: the body and the firework
// together, because both are off by default and the loaders honour the
// setting. Turning on only one of them and calling the other loader anyway is
// how the firework went unphotographed while this tool claimed that a prop you
// cannot photograph is a prop you cannot judge. A missing file is not an
// error; it just leaves the built one showing.
if (new URLSearchParams(location.search).has('scan')) {
  settings.set('detailedPlayerModel', true);
  settings.set('detailedRocketModel', true);
  await avatar.loadModel('../assets/').catch(() => false);
  await avatar.loadRocketModel('../assets/').catch(() => false);
  avatar.applyModelMode();
  avatar.applyRocketModel();
  /*
    ?weights paints the scan by which joint each vertex actually follows.

    Everything that went wrong with this rig went wrong in the weighting, and
    every round of it was diagnosed by squinting at a photograph of a deformed
    figure and guessing which bone had claimed what. A colour per joint answers
    that outright: an arm that comes out wing-coloured is an arm the wings will
    drag, and it says so standing still, before any pose can hide it.
  */
  /*
    ?plain drops the photograph and lights a white surface instead.

    A black patch on a textured figure is either a hole, a dark part of the
    bake, or a normal pointing the wrong way, and the three look identical.
    On a plain white body only one of them can still be black.
  */
  if (new URLSearchParams(location.search).has('plain')) {
    for (const mesh of avatar.scanSkins) {
      mesh.material = new THREE.MeshStandardMaterial({
        color: 0xdddddd, roughness: 0.9, metalness: 0, side: THREE.DoubleSide,
      });
    }
  }
  if (new URLSearchParams(location.search).has('weights')) {
    // One colour per joint, in the skeleton's own order, and long enough for
    // it: the list used to be eight and wrapped as soon as a collarbone was
    // added, which painted the wings the same white as the chest and made the
    // picture lie in exactly the place it was being read.
    const palette = [
      [0.85, 0.85, 0.85],   // spine
      [1.0, 0.85, 0.2],     // head
      [0.2, 0.5, 1.0],      // clavL
      [0.1, 0.85, 0.95],    // clavR
      [0.2, 0.9, 0.3],      // armL
      [0.7, 1.0, 0.2],      // armR
      [1.0, 0.3, 0.2],      // legL
      [1.0, 0.55, 0.1],     // legR
      [1.0, 0.3, 0.9],      // wingL
      [0.6, 0.3, 1.0],      // wingR
      [0.5, 0.5, 0.5], [0.3, 0.3, 0.3],
    ];
    const names = (await import('../src/player/avatar.js')).SCAN_JOINT_NAMES;
    console.log('joint colours:', names.map((n, i) => `${n}=${palette[i]}`).join(' '));
    for (const mesh of avatar.scanSkins) {
      const index = mesh.geometry.getAttribute('skinIndex');
      const weight = mesh.geometry.getAttribute('skinWeight');
      const colour = new Float32Array(index.count * 3);
      for (let v = 0; v < index.count; v += 1) {
        let best = 0;
        let most = -1;
        for (let k = 0; k < 4; k += 1) {
          if (weight.getComponent(v, k) > most) {
            most = weight.getComponent(v, k);
            best = index.getComponent(v, k);
          }
        }
        const rgb = palette[best % palette.length];
        // Dimmed by how sure it is, so a half-and-half band reads as muddy
        // rather than as a clean claim.
        for (let c = 0; c < 3; c += 1) colour[v * 3 + c] = rgb[c] * (0.35 + 0.65 * most);
      }
      mesh.geometry.setAttribute('color', new THREE.BufferAttribute(colour, 3));
      mesh.material = new THREE.MeshBasicMaterial({
        vertexColors: true, side: THREE.DoubleSide,
      });
    }
  }
}
avatar.root.scale.setScalar(1.83);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);

/** A stand-in for the player object the avatar reads each frame. */
function makePlayer(over = {}) {
  return {
    position: new THREE.Vector3(),
    renderPosition: new THREE.Vector3(),
    velocity: new THREE.Vector3(),
    height: 1.83, scale: 1, pitch: 0, yaw: 0,
    mode: 'walk', onGround: true, swimming: false, groundSlope: 0,
    elytraDeployed: false, horizontalSpeed: 0, selectedSlot: 0,
    rocketsFired: 0, ...over,
  };
}

const POSES = {
  'glide-behind': {
    player: { elytraDeployed: true, onGround: false, pitch: -0.2, horizontalSpeed: 44,
      velocity: new THREE.Vector3(0, -8, -44), mode: 'glide' },
    camera: [0, 3.4, 3.7], look: [0, 1.3, 0],
  },
  'glide-above': {
    player: { elytraDeployed: true, onGround: false, pitch: -0.5, horizontalSpeed: 46,
      velocity: new THREE.Vector3(0, -12, -46), mode: 'glide' },
    camera: [0, 4.6, 2.6], look: [0, 1.2, 0],
  },
  // The model faces −Z, so the camera that sees its front stands at −Z. It was
  // at +Z, which photographed the back of the figure and called it the front —
  // and since the sun comes from −Z as well, that shot was of the shadowed
  // side, which made every part of the body read darker than it is.
  // Broadside to a glide. From behind, the body is end-on and every part of it
  // hides behind the part in front; this is the view that says what attitude
  // the figure is actually in.
  'glide-side': {
    player: { elytraDeployed: true, onGround: false, pitch: -0.35, horizontalSpeed: 45,
      velocity: new THREE.Vector3(0, -10, -44), mode: 'glide' },
    camera: [4.6, 2.0, 0], look: [0, 1.3, 0],
  },
  // Mid-stride. The limbs moved, so the walk wants looking at as well as the
  // standing pose — legs that are wider apart can swing into each other.
  'walk': {
    player: { horizontalSpeed: 4.2, velocity: new THREE.Vector3(0, 0, -4.2) },
    frames: 53, camera: [2.9, 1.1, -2.2], look: [0, 0.95, 0],
  },
  // Straight down on a level glide, close in: the view that shows the wing's
  // plan shape, which is the whole of its silhouette from a chase camera.
  'wings-plan': {
    player: { elytraDeployed: true, onGround: false, mode: 'glide', pitch: 0,
      horizontalSpeed: 45, velocity: new THREE.Vector3(0, 0, -45) },
    camera: [0, 5.0, 0.01], look: [0, 1.7, 0],
  },
  // And from dead astern, level, which is where dihedral shows itself.
  'wings-astern': {
    player: { elytraDeployed: true, onGround: false, mode: 'glide', pitch: 0,
      horizontalSpeed: 45, velocity: new THREE.Vector3(0, 0, -45) },
    camera: [0, 1.75, 3.4], look: [0, 1.75, 0],
  },
  'stand-front': { player: {}, camera: [0, 1.1, -3.6], look: [0, 1.0, 0] },
  'stand-side': { player: {}, camera: [3.6, 1.1, 0], look: [0, 1.0, 0] },
  'stand-back': { player: {}, camera: [0, 1.4, 3.6], look: [0, 1.0, 0] },
};

window.__pose = (name) => {
  const spec = POSES[name];
  const player = makePlayer(spec.player);
  // Settle, so the damped shoulders, glide blend and head are where they end up
  // rather than one frame into getting there.
  for (let i = 0; i < (spec.frames ?? 240); i += 1) avatar.update(player, 1 / 60);
  camera.position.set(...spec.camera);
  camera.lookAt(...spec.look);
  renderer.render(scene, camera);
};

/**
 * Mean brightness of the pixels belonging to each part.
 *
 * Done by rendering the parts one at a time against a key colour rather than
 * by guessing which pixels are which: everything else is hidden, the part is
 * drawn, and the pixels that are not the background are the part.
 */
window.__measure = () => {
  const groups = {
    jacket: [avatar.torso, avatar.armL.limb, avatar.armR.limb],
    trousers: [avatar.legL.limb, avatar.legR.limb],
    skin: [avatar.head],
    wing: [avatar.wingL, avatar.wingR],
  };
  // Snapshot every mesh and every group in the model, not just the ones being
  // asked about: the first version hid the five it knew and left the hair, the
  // boots and the firework drawn in all four passes, so the "wing" column of a
  // standing figure — which has no wings — came back as 84.
  const was = new Map();
  avatar.root.traverse((o) => was.set(o, o.visible));
  const wasWings = avatar.wings.visible;
  // A mesh shows itself and its groups, but not the meshes hanging off it: a
  // leg has a boot welded under it, and counting the boot in the trouser is
  // how both came back with the same number.
  const show = (part) => {
    part.visible = true;
    if (!part.isMesh) part.traverse((o) => { o.visible = true; });
    for (let p = part.parent; p && p !== avatar.root.parent; p = p.parent) p.visible = true;
  };
  const out = {};
  // Against a key no part of a person can be, with the ground taken away, so
  // the pixels that are not the key are exactly the pixels of the part. The
  // first attempt keyed on colour with the ground still in frame, and the
  // green of the grass came back as the green of the wings.
  ground.visible = false;
  scene.background = new THREE.Color(0xff00ff);
  for (const [name, parts] of Object.entries(groups)) {
    avatar.root.traverse((o) => { o.visible = false; });
    avatar.root.visible = true;
    if (name !== 'wing' || wasWings) for (const part of parts) show(part);
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth;
    const h = gl.drawingBufferHeight;
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0;
    let n = 0;
    let blown = 0;
    for (let i = 0; i < buf.length; i += 4) {
      const r = buf[i]; const g = buf[i + 1]; const b = buf[i + 2];
      if (r > 240 && g < 20 && b > 240) continue;
      const luma = r * 0.299 + g * 0.587 + b * 0.114;
      sum += luma;
      n += 1;
      if (luma > 200) blown += 1;
    }
    out[name] = { mean: n ? sum / n : 0, n, blown: n ? blown / n : 0 };
  }
  for (const [o, v] of was) o.visible = v;
  ground.visible = true;
  scene.background = new THREE.Color(0x6b7a86);
  renderer.render(scene, camera);
  return out;
};

/** Where every part of the body ends up, in world metres, for a given pose. */
window.__where = (name) => {
  window.__pose(name);
  scene.updateMatrixWorld(true);
  const at = (o) => {
    const v = new THREE.Vector3();
    o.getWorldPosition(v);
    return [v.x, v.y, v.z].map((n) => Number(n.toFixed(2)));
  };
  return {
    head: at(avatar.head), neck: at(avatar.neck), torso: at(avatar.torso),
    shoulderL: at(avatar.armL.pivot), handL: at(avatar.fistL),
    handR: at(avatar.fistR),
    hipR: at(avatar.legR.pivot), kneeR: at(avatar.legR.limb), bootR: at(avatar.bootR),
    wingRoot: at(avatar.wings), wingTipR: at(avatar.wingR.children[0]),
  };
};

window.__pose('stand-front');
// Exposed so a probe can ask what is actually being drawn, which is a
// different question from what a screenshot looks like.
window.__avatar = avatar;
window.__ready = true;
</script>
