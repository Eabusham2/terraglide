<!doctype html>
<meta charset="utf-8">
<title>TerraGlide — the character on its own</title>
<style>html,body{margin:0;background:#6b7a86;overflow:hidden}canvas{display:block}</style>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { Avatar } from '../src/player/avatar.js';
import { settings } from '../src/core/settings.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
/*
  ?size=N renders at N instead of 700.

  Everything about this figure has been judged from a 700-pixel square, which
  is about the size it is in a contact sheet and nowhere near the size it needs
  to be to tell a hole from a stair-stepped edge. A black speck at 700 is four
  pixels; at 2400 it is either a hole or it is gone.
*/
const SIZE = Math.min(4096, Math.max(200,
  Number(new URLSearchParams(location.search).get('size')) || 700));
renderer.setSize(SIZE, SIZE);
/*
  And drawn at twice that, then resolved down.

  Four-sample multisampling smooths the edge of a silhouette and does nothing
  at all for what is inside it, so a black boot against dark ground came out
  with a notched, stepped outline and a smooth shading gradient down a trouser
  leg came out in bands — both of which read as a compressed picture and are
  neither: the atlas is a 1024 PNG uploaded at 1024, and the positions,
  normals and coordinates are all float32. It was the shot that was low
  resolution, not the model in it. Rendering into a buffer twice as wide and
  letting the browser resolve it into the screenshot samples every pixel four
  times over, inside the silhouette as well as on it.
*/
renderer.setPixelRatio(2);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6b7a86);

// The game's own lights, at the game's own intensities. See world/sky.js.
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-0.45, 0.78, -0.44).multiplyScalar(100);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd0e4, 0x4a4a44, 1.1));

// A patch of ground, so the figure is standing on something and the hemisphere
// light has a floor to bounce off the way it does in the world.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshLambertMaterial({ color: 0x5b6b4a }),
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const avatar = new Avatar(scene);
avatar.setVisible(true);
// The scanned pieces, when they are asked for: the body and the firework
// together, because both are off by default and the loaders honour the
// setting. Turning on only one of them and calling the other loader anyway is
// how the firework went unphotographed while this tool claimed that a prop you
// cannot photograph is a prop you cannot judge. A missing file is not an
// error; it just leaves the built one showing.
if (new URLSearchParams(location.search).has('scan')) {
  settings.set('detailedPlayerModel', true);
  settings.set('detailedRocketModel', true);
  await avatar.loadModel('../assets/').catch(() => false);
  await avatar.loadRocketModel('../assets/').catch(() => false);
  avatar.applyModelMode();
  avatar.applyRocketModel();
  /*
    ?weights paints the scan by which joint each vertex actually follows.

    Everything that went wrong with this rig went wrong in the weighting, and
    every round of it was diagnosed by squinting at a photograph of a deformed
    figure and guessing which bone had claimed what. A colour per joint answers
    that outright: an arm that comes out wing-coloured is an arm the wings will
    drag, and it says so standing still, before any pose can hide it.
  */
  /*
    ?plain drops the photograph and lights a white surface instead.

    A black patch on a textured figure is either a hole, a dark part of the
    bake, or a normal pointing the wrong way, and the three look identical.
    On a plain white body only one of them can still be black.
  */
  if (new URLSearchParams(location.search).has('plain')) {
    for (const mesh of avatar.scanSkins) {
      mesh.material = new THREE.MeshStandardMaterial({
        color: 0xdddddd, roughness: 0.9, metalness: 0, side: THREE.DoubleSide,
      });
    }
  }
  if (new URLSearchParams(location.search).has('weights')) {
    // One colour per joint, in the skeleton's own order, and long enough for
    // it: the list used to be eight and wrapped as soon as a collarbone was
    // added, which painted the wings the same white as the chest and made the
    // picture lie in exactly the place it was being read.
    const palette = [
      [0.85, 0.85, 0.85],   // spine
      [1.0, 0.85, 0.2],     // head
      [0.2, 0.5, 1.0],      // clavL
      [0.1, 0.85, 0.95],    // clavR
      [0.2, 0.9, 0.3],      // armL
      [0.7, 1.0, 0.2],      // armR
      [1.0, 0.3, 0.2],      // legL
      [1.0, 0.55, 0.1],     // legR
      [1.0, 0.3, 0.9],      // wingL
      [0.6, 0.3, 1.0],      // wingR
      [0.5, 0.5, 0.5], [0.3, 0.3, 0.3],
    ];
    const names = (await import('../src/player/avatar.js')).SCAN_JOINT_NAMES;
    console.log('joint colours:', names.map((n, i) => `${n}=${palette[i]}`).join(' '));
    for (const mesh of avatar.scanSkins) {
      const index = mesh.geometry.getAttribute('skinIndex');
      const weight = mesh.geometry.getAttribute('skinWeight');
      const colour = new Float32Array(index.count * 3);
      for (let v = 0; v < index.count; v += 1) {
        let best = 0;
        let most = -1;
        for (let k = 0; k < 4; k += 1) {
          if (weight.getComponent(v, k) > most) {
            most = weight.getComponent(v, k);
            best = index.getComponent(v, k);
          }
        }
        const rgb = palette[best % palette.length];
        // Dimmed by how sure it is, so a half-and-half band reads as muddy
        // rather than as a clean claim.
        for (let c = 0; c < 3; c += 1) colour[v * 3 + c] = rgb[c] * (0.35 + 0.65 * most);
      }
      mesh.geometry.setAttribute('color', new THREE.BufferAttribute(colour, 3));
      mesh.material = new THREE.MeshBasicMaterial({
        vertexColors: true, side: THREE.DoubleSide,
      });
    }
  }
}
avatar.root.scale.setScalar(1.83);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);

/** A stand-in for the player object the avatar reads each frame. */
function makePlayer(over = {}) {
  return {
    position: new THREE.Vector3(),
    renderPosition: new THREE.Vector3(),
    velocity: new THREE.Vector3(),
    height: 1.83, scale: 1, pitch: 0, yaw: 0,
    mode: 'walk', onGround: true, swimming: false, groundSlope: 0,
    elytraDeployed: false, horizontalSpeed: 0, selectedSlot: 0,
    rocketsFired: 0, ...over,
  };
}

const POSES = {
  'glide-behind': {
    player: { elytraDeployed: true, onGround: false, pitch: -0.2, horizontalSpeed: 44,
      velocity: new THREE.Vector3(0, -8, -44), mode: 'glide' },
    camera: [0, 3.4, 3.7], look: [0, 1.3, 0],
  },
  'glide-above': {
    player: { elytraDeployed: true, onGround: false, pitch: -0.5, horizontalSpeed: 46,
      velocity: new THREE.Vector3(0, -12, -46), mode: 'glide' },
    camera: [0, 4.6, 2.6], look: [0, 1.2, 0],
  },
  // The model faces −Z, so the camera that sees its front stands at −Z. It was
  // at +Z, which photographed the back of the figure and called it the front —
  // and since the sun comes from −Z as well, that shot was of the shadowed
  // side, which made every part of the body read darker than it is.
  // Broadside to a glide. From behind, the body is end-on and every part of it
  // hides behind the part in front; this is the view that says what attitude
  // the figure is actually in.
  'glide-side': {
    player: { elytraDeployed: true, onGround: false, pitch: -0.35, horizontalSpeed: 45,
      velocity: new THREE.Vector3(0, -10, -44), mode: 'glide' },
    camera: [4.6, 2.0, 0], look: [0, 1.3, 0],
  },
  // Mid-stride. The limbs moved, so the walk wants looking at as well as the
  // standing pose — legs that are wider apart can swing into each other.
  'walk': {
    player: { horizontalSpeed: 4.2, velocity: new THREE.Vector3(0, 0, -4.2) },
    frames: 53, camera: [2.9, 1.1, -2.2], look: [0, 0.95, 0],
  },
  // Straight down on a level glide, close in: the view that shows the wing's
  // plan shape, which is the whole of its silhouette from a chase camera.
  'wings-plan': {
    player: { elytraDeployed: true, onGround: false, mode: 'glide', pitch: 0,
      horizontalSpeed: 45, velocity: new THREE.Vector3(0, 0, -45) },
    camera: [0, 5.0, 0.01], look: [0, 1.7, 0],
  },
  // And from dead astern, level, which is where dihedral shows itself.
  'wings-astern': {
    player: { elytraDeployed: true, onGround: false, mode: 'glide', pitch: 0,
      horizontalSpeed: 45, velocity: new THREE.Vector3(0, 0, -45) },
    camera: [0, 1.75, 3.4], look: [0, 1.75, 0],
  },
  // Dead ahead of a glide, which is the view a second flier would have of you
  // and the one that says whether the figure has two arms. From behind and
  // from above the near arm hides the far one against the body, and "he has
  // one arm" is a thing that can be true of the model or true only of the
  // angle it was photographed from.
  'glide-front': {
    player: { elytraDeployed: true, onGround: false, pitch: -0.2, horizontalSpeed: 44,
      velocity: new THREE.Vector3(0, -8, -44), mode: 'glide' },
    camera: [0, 2.5, -3.9], look: [0, 1.35, 0],
  },
  // And from underneath, level: the side of a flier everyone else sees most of
  // the time, and the side the soles are on.
  'glide-below': {
    player: { elytraDeployed: true, onGround: false, mode: 'glide', pitch: 0,
      horizontalSpeed: 45, velocity: new THREE.Vector3(0, 0, -45) },
    camera: [0, -2.4, 1.2], look: [0, 1.4, 0],
  },
  // Climbing on a firework, which is what puts the right arm out ahead: the
  // reach is on while the rocket burns or while the flight path points up.
  'rocket-side': {
    player: { elytraDeployed: true, onGround: false, mode: 'glide', pitch: 0.35,
      horizontalSpeed: 40, velocity: new THREE.Vector3(0, 12, -40) },
    camera: [4.6, 2.2, 0], look: [0, 1.4, 0],
  },
  'rocket-front': {
    player: { elytraDeployed: true, onGround: false, mode: 'glide', pitch: 0.35,
      horizontalSpeed: 40, velocity: new THREE.Vector3(0, 12, -40) },
    camera: [2.6, 2.6, -3.2], look: [0, 1.4, 0],
  },
  /*
    Standing, with the firework in hand, close enough to see it.

    Every picture of the rocket until now was of a *flight*: the reach pose,
    the whole figure, forty metres up. That answers "does the arm go forward"
    and not "what is he holding", and the two are different questions. These
    are shot from a metre and a half, at the height of the hand.

    One per slot, because the nose takes the colour of the slot you are on -
    pale blue, green, yellow, orange, red for one through five - so that what
    is in the hand and what is lit in the hotbar are visibly the same rocket.
  */
  'hold-1': { player: { selectedSlot: 0 }, camera: [1.15, 1.0, -1.15], look: [0.28, 0.86, 0] },
  'hold-2': { player: { selectedSlot: 1 }, camera: [1.15, 1.0, -1.15], look: [0.28, 0.86, 0] },
  'hold-3': { player: { selectedSlot: 2 }, camera: [1.15, 1.0, -1.15], look: [0.28, 0.86, 0] },
  'hold-4': { player: { selectedSlot: 3 }, camera: [1.15, 1.0, -1.15], look: [0.28, 0.86, 0] },
  'hold-5': { player: { selectedSlot: 4 }, camera: [1.15, 1.0, -1.15], look: [0.28, 0.86, 0] },
  // And the whole figure holding one, so the hand reads in context.
  'hold-whole': { player: { selectedSlot: 2 }, camera: [2.2, 1.25, -2.4], look: [0, 0.95, 0] },
  // Square on, framed on the hand and on the whole figure. The first angle
  // tried here was down the arm with the fist against a black trouser leg,
  // which is the hardest possible read of where a dark object is relative to a
  // hand; four were rendered and compared before these two.
  // The hand alone, from under and from in front of the palm, to see whether
  // that fist has any opening in it at all.
  'hand-under': { player: { selectedSlot: 4 }, camera: [0.34, 0.10, -0.55], look: [0.30, 0.88, 0] },
  'hand-palm': { player: { selectedSlot: 4 }, camera: [1.05, 0.88, 0.55], look: [0.30, 0.88, 0] },
  // Dead centre in front of the figure, level: no offset towards the hand, no
  // turn, so nothing about the view is at an angle to him.
  'grip-square': { player: { selectedSlot: 4 }, camera: [0, 0.92, -1.7], look: [0, 0.92, 0] },
  'grip-front': { player: { selectedSlot: 4 }, camera: [0.28, 0.92, -1.15], look: [0.28, 0.92, 0] },
  // Round the hand, because judging this from one camera has been wrong every
  // time: a tube that overlaps the fingers from the front can be a tube
  // hovering a hand's width away seen from the side, and the two are the same
  // picture square on.
  'grip-r0': { player: { selectedSlot: 4 }, camera: [0.28, 0.92, -1.0], look: [0.28, 0.90, 0] },
  'grip-r45': { player: { selectedSlot: 4 }, camera: [0.99, 0.92, -0.71], look: [0.28, 0.90, 0] },
  'grip-r90': { player: { selectedSlot: 4 }, camera: [1.28, 0.92, 0], look: [0.28, 0.90, 0] },
  'grip-r135': { player: { selectedSlot: 4 }, camera: [0.99, 0.92, 0.71], look: [0.28, 0.90, 0] },
  'grip-r180': { player: { selectedSlot: 4 }, camera: [0.28, 0.92, 1.0], look: [0.28, 0.90, 0] },
  'grip-r270': { player: { selectedSlot: 4 }, camera: [-0.72, 0.92, 0], look: [0.28, 0.90, 0] },
  'grip-rup': { player: { selectedSlot: 4 }, camera: [0.28, 1.55, -0.75], look: [0.28, 0.90, 0] },
  'grip-rdn': { player: { selectedSlot: 4 }, camera: [0.28, 0.30, -0.85], look: [0.28, 0.92, 0] },
  'grip-front-wide': { player: { selectedSlot: 4 }, camera: [0, 1.05, -2.6], look: [0, 1.0, 0] },
  /*
    The steep end of a glide, both ways.

    The carried firework is held at a world angle, not at the hand's angle, so
    the shallow glides above cannot show whether that comes apart: twenty
    degrees of pitch hides almost anything. Seventy degrees does not.
  */
  'dive-steep': {
    player: { elytraDeployed: true, onGround: false, pitch: -1.2, mode: 'glide',
      horizontalSpeed: 30, velocity: new THREE.Vector3(0, -60, -30) },
    camera: [4.0, 1.6, 0], look: [0, 1.3, 0],
  },
  'climb-steep': {
    player: { elytraDeployed: true, onGround: false, pitch: 1.2, mode: 'glide',
      horizontalSpeed: 30, velocity: new THREE.Vector3(0, 40, -30) },
    camera: [4.0, 1.6, 0], look: [0, 1.3, 0],
  },
  'stand-front': { player: {}, camera: [0, 1.1, -3.6], look: [0, 1.0, 0] },
  'stand-side': { player: {}, camera: [3.6, 1.1, 0], look: [0, 1.0, 0] },
  'stand-back': { player: {}, camera: [0, 1.4, 3.6], look: [0, 1.0, 0] },
};

/*
  Does the firework actually touch the hand?

  Looking at a picture and deciding "that reads as held" has now been wrong
  four times in a row. This measures it: the closest any vertex of the fist
  comes to the rocket's own axis, against the radius of the tube. Less than the
  radius and the hand is inside the tube - it is gripped. More, and there is
  daylight between them, which is what "flying" looks like.
*/
window.__grip = () => {
  const skin = avatar.scanSkins?.[0];
  if (!skin || !avatar.rocket) return null;
  const arm = avatar.scanBones?.armR;
  const armIndex = (avatar.scanBoneList ?? []).indexOf(arm);
  const geo = skin.geometry;
  const idx = geo.getAttribute('skinIndex');
  const wt = geo.getAttribute('skinWeight');
  const held = [];
  for (let v = 0; v < idx.count; v += 1) {
    for (let k = 0; k < 4; k += 1) {
      if (idx.getComponent(v, k) !== armIndex) continue;
      if (wt.getComponent(v, k) < 0.7) continue;
      held.push(v);
      break;
    }
  }
  if (!held.length || armIndex < 0) return { held: held.length, armIndex };
  const world = new THREE.Vector3();
  const points = held.map((v) => {
    skin.getVertexPosition(v, world);
    return skin.localToWorld(world.clone());
  });
  points.sort((a, b) => a.y - b.y);
  const fist = points.slice(0, Math.max(10, Math.round(points.length * 0.33)));
  const foot = avatar.rocket.getWorldPosition(new THREE.Vector3());
  const tip = avatar.rocket.localToWorld(new THREE.Vector3(0, 1, 0)).sub(foot).normalize();
  let nearest = Infinity;
  for (const p of fist) {
    const along = Math.max(0, Math.min(0.4, p.clone().sub(foot).dot(tip)));
    const on = foot.clone().addScaledVector(tip, along);
    nearest = Math.min(nearest, p.distanceTo(on));
  }
  // Touching is not enough: a tube buried through the middle of the fist also
  // touches, and that is the one that reads as floating, because every part of
  // it that meets the hand is hidden inside it. So also: how far the axis
  // passes from the fist's own centre, against the fist's own radius. Through
  // the middle is 0; clear of the hand is more than 1; against the fingers,
  // where a hand holds something, is in between.
  const middle = fist.reduce((sum, p) => sum.add(p), new THREE.Vector3())
    .multiplyScalar(1 / fist.length);
  const spread = fist.reduce((sum, p) => sum + p.distanceTo(middle), 0) / fist.length;
  const along = Math.max(0, Math.min(0.4, middle.clone().sub(foot).dot(tip)));
  const centreGap = middle.distanceTo(foot.clone().addScaledVector(tip, along));
  // What actually separates held from floating is how much of the hand the
  // tube passes through - not where its axis sits relative to the fist's
  // middle, which says nothing about whether the tube is at finger height or
  // sailing over the knuckles.
  const radius = 0.026 * avatar.rocket.scale.x;
  let inside = 0;
  for (const p of fist) {
    const at = Math.max(0, Math.min(0.4, p.clone().sub(foot).dot(tip)));
    if (p.distanceTo(foot.clone().addScaledVector(tip, at)) < radius) inside += 1;
  }
  return {
    fist: avatar.scanFist, scale: avatar.rocket.scale.x, radius,
    middle: middle.toArray(),
    nearest, spread, centreGap, offCentre: centreGap / spread,
    through: inside / fist.length,
  };
};

window.__fist = () => window.__grip();

/*
  Square on to the FIST, not to the firework.

  __facingTip follows the nose, so when the firework is nudged the camera is
  nudged with it and the picture barely changes - the body slides instead.
  This one is anchored to the hand, which does not move, so two shots taken
  before and after a nudge can actually be compared.
*/
/*
  Anywhere on a circle round the fist, at the fist's own height.

  turn is degrees: 0 is square on to the front, 90 is off the figure's right
  and 180 is dead behind. __atFist only does front and back, and "is it
  sideways" is a question only a side answers.
*/
/*
  The whole figure, from anywhere on a circle round it.

  turn is degrees: 0 is the front, 90 the figure's right, 180 the back. Saves
  a named pose per angle when what is wanted is the same pose seen round.
*/
/*
  The whole figure, framed to fill the picture, from anywhere round it.

  __around aims at a fixed point on the spot the figure stands on, which is
  right for standing and wrong for everything else: a glide slides the body
  forward of that point and tips it, so the same numbers put the figure in a
  corner with its legs out of shot. This measures where the body actually is
  and backs off far enough to hold it, so one call frames a walk, a glide and
  a climb alike.

  turn is degrees round: 0 is the front, 90 the figure's right, 180 the back.
  lift is degrees above the horizon.
*/
window.__frame = (turn = 0, lift = 8, pad = 1.15) => {
  const box = new THREE.Box3();
  avatar.root.updateMatrixWorld(true);
  for (const mesh of (avatar.scanSkins?.length ? avatar.scanSkins : [avatar.root])) {
    box.expandByObject(mesh);
  }
  if (box.isEmpty()) box.setFromObject(avatar.root);
  const middle = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  // Far enough that the longest diagonal fits the narrower half-angle, which
  // for a square frame is either.
  const dist = (size * pad) / (2 * Math.tan((camera.fov * Math.PI) / 360));
  const a = (turn * Math.PI) / 180;
  const up = (lift * Math.PI) / 180;
  camera.position.set(
    middle.x + Math.sin(a) * Math.cos(up) * dist,
    middle.y + Math.sin(up) * dist,
    middle.z - Math.cos(a) * Math.cos(up) * dist,
  );
  camera.lookAt(middle);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

window.__around = (turn = 0, dist = 3.4, height = 1.15, at = 1.0) => {
  const a = (turn * Math.PI) / 180;
  camera.position.set(Math.sin(a) * dist, height, -Math.cos(a) * dist);
  camera.lookAt(0, at, 0);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

window.__roundFist = (turn = 90, dist = 0.9, lift = 0.0) => {
  const middle = new THREE.Vector3().fromArray(window.__grip().middle);
  const a = (turn * Math.PI) / 180;
  camera.position.set(
    middle.x + Math.sin(a) * dist,
    middle.y + lift,
    middle.z - Math.cos(a) * dist,
  );
  camera.lookAt(middle);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

window.__atFist = (dist = 0.9, lift = 0.0, behind = false, shift = 0.0) => {
  const middle = new THREE.Vector3().fromArray(window.__grip().middle);
  // shift is the viewer's right, which is -X from the front and +X from
  // behind, because turning round swaps which way your right hand points.
  const side = behind ? shift : -shift;
  camera.position.set(middle.x + side, middle.y + lift, middle.z + (behind ? dist : -dist));
  camera.lookAt(middle);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

/*
  Sighted straight down the firework.

  "Lined up with the tip" is not a camera placed near the tip - that is just a
  close-up taken from wherever the camera happened to be, which is what the
  last one was. It is a camera on the rocket's own axis, ahead of the nose,
  looking back along it. Then the tube points at the lens and any lean shows as
  the tail sticking out to one side of the nose rather than as foreshortening.
*/
window.__alongRocket = (back = 0.9, aim = 0.0) => {
  const grip = avatar.rocket.getWorldPosition(new THREE.Vector3());
  const dir = avatar.rocket.localToWorld(new THREE.Vector3(0, 1, 0)).sub(grip).normalize();
  const tip = grip.clone().addScaledVector(dir, 0.15);
  camera.position.copy(tip).addScaledVector(dir, back);
  camera.lookAt(grip.clone().addScaledVector(dir, aim));
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

// Dead in front of the firework's nose: the camera sits on the tip's own
// height and side-to-side line, square to the figure, so the tip is in the
// middle of the frame rather than off to one edge.
window.__facingTip = (dist = 1.0, lift = 0.0) => {
  const grip = avatar.rocket.getWorldPosition(new THREE.Vector3());
  const dir = avatar.rocket.localToWorld(new THREE.Vector3(0, 1, 0)).sub(grip).normalize();
  const tip = grip.clone().addScaledVector(dir, 0.15);
  camera.position.set(tip.x, tip.y + lift, tip.z - dist);
  camera.lookAt(tip);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

/*
  The two ends of the firework, in world space.

  Measured off the mesh rather than assumed: the scanned firework and the
  built one sit differently against the rocket object's origin, and the held
  one is scaled, so "the tail is 105 mm down" is only true for one of them.
  Every vertex is projected onto the rocket's own axis and the two extremes
  are the nose and the tail.
*/
window.__markEnds = () => {
  const e = window.__ends();
  for (const [where, colour] of [[e.tail, 0x00ffff], [e.nose, 0xff00ff]]) {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.012, 12, 8),
      new THREE.MeshBasicMaterial({ color: colour }),
    );
    dot.position.fromArray(where);
    scene.add(dot);
  }
  return e;
};

/*
  The firework's angle in the hand's own frame.

  The rocket is a child of the arm bone it is held by, so its local rotation
  IS the grip: if that number is the same standing and mid-stride, the hold is
  the same hold. Which is worth having as a number, because from a camera that
  moves with the rocket the two pictures look alike whether or not they are -
  it was 62 degrees of roll across one stride and it did not read as one.
*/
window.__localGrip = () => {
  const e = new THREE.Euler().setFromQuaternion(avatar.rocket.quaternion, 'XYZ');
  const deg = (n) => (n * 180 / Math.PI).toFixed(1).padStart(7);
  const mm = (n) => (n * 1000).toFixed(1).padStart(7);
  const p = avatar.rocket.position;
  return `euler ${deg(e.x)} ${deg(e.y)} ${deg(e.z)}  at ${mm(p.x)} ${mm(p.y)} ${mm(p.z)} mm`;
};

window.__ends = () => {
  const foot = avatar.rocket.getWorldPosition(new THREE.Vector3());
  const dir = avatar.rocket.localToWorld(new THREE.Vector3(0, 1, 0)).sub(foot).normalize();
  const along = [];
  const at = new THREE.Vector3();
  avatar.rocket.traverse((node) => {
    const pos = node.geometry?.attributes?.position;
    // Only what is actually drawn: the built firework's tube, cone and stick
    // hang off the same object with visible false whenever the scan is in
    // hand, and the built stick reaches 430 mm back - four times the whole
    // scanned firework.
    if (!pos || !node.visible || !node.parent?.visible) return;
    for (let v = 0; v < pos.count; v += 1) {
      at.fromBufferAttribute(pos, v);
      node.localToWorld(at);
      along.push(at.sub(foot).dot(dir));
    }
  });
  if (!along.length) return null;
  along.sort((a, b) => a - b);
  // Half a percent in from each end rather than the extremes. The scan carries
  // a scatter of stray vertices - it is a photogrammetry mesh, not a modelled
  // one - and going by the furthest of those put the "tail" 250 mm behind a
  // firework that measures 210 mm on screen.
  const edge = Math.max(1, Math.round(along.length * 0.005));
  const lo = along[edge];
  const hi = along[along.length - 1 - edge];
  return {
    dir: dir.toArray(),
    tail: foot.clone().addScaledVector(dir, lo).toArray(),
    nose: foot.clone().addScaledVector(dir, hi).toArray(),
    length: hi - lo,
  };
};

/*
  Square on to the TAIL, from behind, the way __facingTip is square on to the
  nose from the front: the camera sits on the tail's own height and
  side-to-side line, so the back of the firework is in the middle of the frame.
*/
/*
  Beside the firework, wherever the firework happens to be.

  The fist cameras are built round a figure standing up: they sit at the
  hand's height and look horizontally, which is the right shot for a man on
  his feet and the wrong one for a man lying along a glide with his arm out
  ahead of him - there the same camera frames a shoulder. This one is built
  round the firework's own axis instead, so it gives the same view of the grip
  in a walk, a glide and a climb.

  turn is degrees around the tube: 0 is level with it and off to one side, 90
  is above it.
*/
window.__besideRocket = (turn = 0, dist = 0.45) => {
  const ends = window.__ends();
  const dir = new THREE.Vector3().fromArray(ends.dir);
  const tail = new THREE.Vector3().fromArray(ends.tail);
  const middle = tail.clone().addScaledVector(dir, ends.length / 2);
  const side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
  // Straight up or down the tube has no "side": fall back to the world X axis
  // rather than to a zero vector, which puts the camera inside the firework.
  if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
  side.normalize();
  const over = new THREE.Vector3().crossVectors(side, dir).normalize();
  const a = (turn * Math.PI) / 180;
  camera.position.copy(middle)
    .addScaledVector(side, Math.cos(a) * dist)
    .addScaledVector(over, Math.sin(a) * dist);
  camera.lookAt(middle);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

window.__facingTail = (dist = 0.9, lift = 0.0) => {
  const tail = new THREE.Vector3().fromArray(window.__ends().tail);
  camera.position.set(tail.x, tail.y + lift, tail.z + dist);
  camera.lookAt(tail);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

/*
  Sighted up the firework from behind its tail - the mirror of __alongRocket.
  End on, so a lean shows as the nose sitting off to one side of the fins
  rather than as foreshortening, and the fist shows as what it is or is not
  wrapped round.
*/
window.__alongTail = (back = 0.6, aim = 0.15, fov = 45, near = 0.01) => {
  const ends = window.__ends();
  const dir = new THREE.Vector3().fromArray(ends.dir);
  const tail = new THREE.Vector3().fromArray(ends.tail);
  camera.position.copy(tail).addScaledVector(dir, -back);
  camera.lookAt(tail.clone().addScaledVector(dir, aim));
  // Two ways to see more of it, because simply standing further back does not
  // work: a quarter of a metre behind the tail the camera is already inside
  // the folded wing, and everything past that is one grey surface. Either
  // widen the lens from where it still fits, or stand back and clip the wing
  // off with the near plane - it is between the lens and the hand, so a near
  // plane set past it removes it and leaves the firework alone.
  camera.fov = fov;
  camera.near = near;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
};

window.__pose = (name, frames) => {
  const spec = POSES[name];
  // Back to the standard lens: __alongTail can leave a wide one and a near
  // plane a third of a metre out, and a pose shot taken through those is not
  // the pose shot anyone means.
  camera.fov = 45;
  camera.near = 0.01;
  const player = makePlayer(spec.player);
  // Settle, so the damped shoulders, glide blend and head are where they end up
  // rather than one frame into getting there.
  // frames overrides the pose's own settle count, which for a walk is which
  // part of the stride it is caught at. A stride is about 43 frames, so 53,
  // 64, 74 and 85 are the four quarters of one.
  for (let i = 0; i < (frames ?? spec.frames ?? 240); i += 1) avatar.update(player, 1 / 60);
  camera.position.set(...spec.camera);
  camera.lookAt(...spec.look);
  renderer.render(scene, camera);
};

/**
 * Mean brightness of the pixels belonging to each part.
 *
 * Done by rendering the parts one at a time against a key colour rather than
 * by guessing which pixels are which: everything else is hidden, the part is
 * drawn, and the pixels that are not the background are the part.
 */
window.__measure = () => {
  const groups = {
    jacket: [avatar.torso, avatar.armL.limb, avatar.armR.limb],
    trousers: [avatar.legL.limb, avatar.legR.limb],
    skin: [avatar.head],
    wing: [avatar.wingL, avatar.wingR],
  };
  // Snapshot every mesh and every group in the model, not just the ones being
  // asked about: the first version hid the five it knew and left the hair, the
  // boots and the firework drawn in all four passes, so the "wing" column of a
  // standing figure — which has no wings — came back as 84.
  const was = new Map();
  avatar.root.traverse((o) => was.set(o, o.visible));
  const wasWings = avatar.wings.visible;
  // A mesh shows itself and its groups, but not the meshes hanging off it: a
  // leg has a boot welded under it, and counting the boot in the trouser is
  // how both came back with the same number.
  const show = (part) => {
    part.visible = true;
    if (!part.isMesh) part.traverse((o) => { o.visible = true; });
    for (let p = part.parent; p && p !== avatar.root.parent; p = p.parent) p.visible = true;
  };
  const out = {};
  // Against a key no part of a person can be, with the ground taken away, so
  // the pixels that are not the key are exactly the pixels of the part. The
  // first attempt keyed on colour with the ground still in frame, and the
  // green of the grass came back as the green of the wings.
  ground.visible = false;
  scene.background = new THREE.Color(0xff00ff);
  for (const [name, parts] of Object.entries(groups)) {
    avatar.root.traverse((o) => { o.visible = false; });
    avatar.root.visible = true;
    if (name !== 'wing' || wasWings) for (const part of parts) show(part);
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth;
    const h = gl.drawingBufferHeight;
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0;
    let n = 0;
    let blown = 0;
    for (let i = 0; i < buf.length; i += 4) {
      const r = buf[i]; const g = buf[i + 1]; const b = buf[i + 2];
      if (r > 240 && g < 20 && b > 240) continue;
      const luma = r * 0.299 + g * 0.587 + b * 0.114;
      sum += luma;
      n += 1;
      if (luma > 200) blown += 1;
    }
    out[name] = { mean: n ? sum / n : 0, n, blown: n ? blown / n : 0 };
  }
  for (const [o, v] of was) o.visible = v;
  ground.visible = true;
  scene.background = new THREE.Color(0x6b7a86);
  renderer.render(scene, camera);
  return out;
};

/** Where every part of the body ends up, in world metres, for a given pose. */
window.__where = (name) => {
  window.__pose(name);
  scene.updateMatrixWorld(true);
  const at = (o) => {
    const v = new THREE.Vector3();
    o.getWorldPosition(v);
    return [v.x, v.y, v.z].map((n) => Number(n.toFixed(2)));
  };
  return {
    head: at(avatar.head), neck: at(avatar.neck), torso: at(avatar.torso),
    shoulderL: at(avatar.armL.pivot), handL: at(avatar.fistL),
    handR: at(avatar.fistR),
    hipR: at(avatar.legR.pivot), kneeR: at(avatar.legR.limb), bootR: at(avatar.bootR),
    wingRoot: at(avatar.wings), wingTipR: at(avatar.wingR.children[0]),
  };
};

/*
  The camera, the scene and the renderer, so a shot can be taken from an angle
  that is not in the list above without editing the list. Nine fixed poses are
  the right thing to keep and the wrong thing to be limited to: "send me
  another angle of it flying" should not be a code change.
*/
// And the rig itself, so a question about where a joint or a drawn-on feature
// ended up can be asked from outside rather than by adding a print to it.
window.__avatar = avatar;
window.__camera = camera;
window.__Box3 = THREE.Box3;
window.__Vec3 = THREE.Vector3;
window.__scene = scene;
window.__renderer = renderer;
window.__shoot = (name, at, look) => {
  window.__pose(name);
  camera.position.set(...at);
  camera.lookAt(...look);
  renderer.render(scene, camera);
};

window.__pose('stand-front');
// Exposed so a probe can ask what is actually being drawn, which is a
// different question from what a screenshot looks like.
window.__avatar = avatar;
window.__ready = true;
</script>
